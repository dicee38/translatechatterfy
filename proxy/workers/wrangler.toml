name = "chatterfy-translator-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Нечувствительные значения — можно коммитить (TZ п.3.4: это не контент).
# MOCK_MODE=true по умолчанию — даже свежий деплой без явного шага
# "выключить мок" ничего реального не потратит.
[vars]
MOCK_MODE = "true"
DAILY_BUDGET_USD = "5"

[[kv_namespaces]]
binding = "BUDGET_KV"
id = "53662b9dec134949974a9d8b39a85ad6"
preview_id = "53662b9dec134949974a9d8b39a85ad6"

# EXTENSION_TOKEN и OPENAI_API_KEY — секреты, НЕ сюда:
#   wrangler secret put EXTENSION_TOKEN
#   wrangler secret put OPENAI_API_KEY
# Локально при `wrangler dev` их значения берутся из .dev.vars (см. .dev.vars.example).
