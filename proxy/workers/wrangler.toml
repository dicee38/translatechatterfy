name = "chatterfy-translator-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Нечувствительные значения — можно коммитить (TZ п.3.4: это не контент).
# MOCK_MODE=false — реальные вызовы к OpenAI включены (ключ уже задан
# через `wrangler secret put OPENAI_API_KEY`, см. CLAUDE.md чек-лист).
[vars]
MOCK_MODE = "false"
# TODO(временно поднято по просьбе оператора, 2026-09-22): было "5".
# Не выключено полностью — оставлен высокий потолок как последний
# рубеж на случай реального сбоя/зацикливания, а не бесконечный лимит.
# Вернуть обратно на разумное значение, когда не нужен свободный тест.
DAILY_BUDGET_USD = "1000"

[[kv_namespaces]]
binding = "BUDGET_KV"
id = "53662b9dec134949974a9d8b39a85ad6"
preview_id = "53662b9dec134949974a9d8b39a85ad6"

# EXTENSION_TOKEN и OPENAI_API_KEY — секреты, НЕ сюда:
#   wrangler secret put EXTENSION_TOKEN
#   wrangler secret put OPENAI_API_KEY
# Локально при `wrangler dev` их значения берутся из .dev.vars (см. .dev.vars.example).
